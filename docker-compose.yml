# RechnungsWerk: Web-App und KoSIT-Validator. Start: docker compose up -d --build
# Fester Projektname: Container, Images, Netze und das Daten-Volume (rechnungswerk_rechnungswerk-data) heißen in jedem
# Ordner gleich, damit eine neu entpackte Version die bisherigen Daten findet. Eine zweite, getrennte Instanz braucht
# deshalb "docker compose -p <name> ..." und einen anderen Port.
name: rechnungswerk

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Nur von diesem Rechner aus erreichbar; für andere Geräte gehört ein Reverse Proxy mit HTTPS davor.
      - "127.0.0.1:8080:8080"
    environment:
      Validator__Url: http://validator:8080/
      # Hinter einem Reverse Proxy mit HTTPS (empfohlen) einschalten, damit die App das Original-Protokoll kennt:
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Wer den Code verändert und anbietet, verlinkt hier den eigenen Quellcode (AGPL-3.0, Abschnitt 13):
      # SourceCode__Url: https://example.org/mein-rechnungswerk
    volumes:
      - rechnungswerk-data:/data
    depends_on:
      - validator
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  validator:
    build: docker/validator
    restart: unless-stopped
    # Kein Port nach außen: Der Validator ist nur für die Web-App im internen Netz erreichbar.
    expose:
      - "8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  backend:
    # Internes Netz ohne Verbindung nach außen.
    internal: true

volumes:
  rechnungswerk-data:
