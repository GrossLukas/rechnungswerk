name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Bauen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Abhängigkeiten laden
        run: dotnet restore

      - name: Bauen
        run: dotnet build --configuration Release --no-restore

      - name: Testen
        run: dotnet test --configuration Release --no-build

  docker:
    name: Container bauen und prüfen
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image der Web-App bauen (ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: rechnungswerk-web:ci

      - name: Image des Validators bauen (ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/validator
          push: false
          load: true
          tags: rechnungswerk-validator:ci

      - name: Validator starten
        run: |
          docker run -d --name validator -p 127.0.0.1:8081:8080 rechnungswerk-validator:ci
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8081/; then exit 0; fi
            sleep 2
          done
          docker logs validator
          exit 1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Erzeugte Rechnungen mit dem Validator prüfen
        env:
          RECHNUNGSWERK_VALIDATOR_URL: http://127.0.0.1:8081/
        run: dotnet test --configuration Release --filter "Category=Validator"

      - name: Web-App starten und aufrufen
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp rechnungswerk-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/einrichtung
              docker exec web test -s /data/setup-code.txt
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1

      - name: Container-Protokolle bei Fehlern
        if: failure()
        run: |
          docker logs validator || true
          docker logs web || true

  install-guide:
    name: Installationsanleitung durchspielen
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Starten, sichern, zurückspielen, übernehmen, aktualisieren und entfernen
        run: |
          set -x -o pipefail
          # Die Befehle zum Sichern, Zurückspielen und Übernehmen kommen wörtlich aus der Anleitung.
          guide() {
            local line
            line=$(grep -F -- "$1" docs/installation.md) || return 1
            [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ] || return 1
            printf '%s\n' "$line"
          }
          backup=$(guide 'echo Sicherung erstellt"')
          restore=$(guide 'echo Sicherung eingespielt"')
          migrate=$(guide 'echo Daten kopiert"')

          wait_for_web() {
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:8080/einrichtung; then return 0; fi
              sleep 2
            done
            return 1
          }
          setup_code() { docker compose exec -T web cat /data/setup-code.txt; }

          docker pull busybox
          docker compose up -d --build 2>&1 | tee compose-up.log
          grep -E 'rechnungswerk-web-1[[:space:]]+Started' compose-up.log
          wait_for_web
          code=$(setup_code)
          test -n "$code"

          if curl -fsS -o /dev/null --max-time 5 "http://$(hostname -I | awk '{print $1}'):8080/einrichtung"; then
            echo "::error::Port 8080 ist nicht nur von diesem Rechner aus erreichbar."
            exit 1
          fi

          docker compose stop web
          test "$(eval "$backup")" = "Sicherung erstellt"
          docker compose start web

          # Ohne Code-Datei legt die App beim Start einen neuen Code an; das Zurückspielen muss den alten bringen.
          docker compose stop web
          docker run --rm -v rechnungswerk_rechnungswerk-data:/data busybox rm /data/setup-code.txt
          docker compose start web
          wait_for_web
          new_code=$(setup_code)
          test "$new_code" != "$code"

          docker compose stop web
          test "$(eval "$restore")" = "Sicherung eingespielt"
          docker compose start web
          wait_for_web
          test "$(setup_code)" = "$code"

          # Eine abgeschnittene Sicherung darf die vorhandenen Daten nicht anrühren.
          mv rechnungswerk-daten.tgz vollstaendig.tgz
          head -c "$(( $(wc -c < vollstaendig.tgz) / 2 ))" vollstaendig.tgz > rechnungswerk-daten.tgz
          docker compose stop web
          if eval "$restore"; then
            echo "::error::Eine abgeschnittene Sicherung wurde eingespielt."
            exit 1
          fi
          docker compose start web
          wait_for_web
          test "$(setup_code)" = "$code"

          # Daten aus einem Volume mit dem früheren, vom Ordner abgeleiteten Namen übernehmen.
          docker compose stop web
          docker run --rm -v rechnungswerk_rechnungswerk-data:/data -v rechnungswerk-main_rechnungswerk-data:/alt busybox cp -a /data/. /alt/
          docker run --rm -v rechnungswerk_rechnungswerk-data:/data busybox sh -c "rm -rf /data/*"
          test "$(eval "$migrate")" = "Daten kopiert"
          docker compose start web
          wait_for_web
          test "$(setup_code)" = "$code"
          docker volume rm rechnungswerk-main_rechnungswerk-data

          # Aktualisieren behält die Daten.
          docker compose down
          docker compose build --pull
          docker compose up -d
          wait_for_web
          test "$(setup_code)" = "$code"

          docker compose down --volumes --rmi all
          if docker volume inspect rechnungswerk_rechnungswerk-data > /dev/null 2>&1; then
            echo "::error::Das Daten-Volume ist nach dem Entfernen noch da."
            exit 1
          fi

      - name: Container-Protokolle bei Fehlern
        if: failure()
        run: docker compose logs || true
