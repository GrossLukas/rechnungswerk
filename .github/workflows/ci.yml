name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Bauen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Abhängigkeiten laden
        run: dotnet restore

      - name: Bauen
        run: dotnet build --configuration Release --no-restore

      - name: Testen
        run: dotnet test --configuration Release --no-build

  docker:
    name: Container bauen und prüfen
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image der Web-App bauen (ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: rechnungswerk-web:ci

      - name: Image des Validators bauen (ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/validator
          push: false
          load: true
          tags: rechnungswerk-validator:ci

      - name: Validator starten
        run: |
          docker run -d --name validator -p 127.0.0.1:8081:8080 rechnungswerk-validator:ci
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8081/; then exit 0; fi
            sleep 2
          done
          docker logs validator
          exit 1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Erzeugte Rechnungen mit dem Validator prüfen
        env:
          RECHNUNGSWERK_VALIDATOR_URL: http://127.0.0.1:8081/
        run: dotnet test --configuration Release --filter "Category=Validator"

      - name: Web-App starten und aufrufen
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp rechnungswerk-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/einrichtung
              docker exec web test -s /data/setup-code.txt
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1

      - name: Container-Protokolle bei Fehlern
        if: failure()
        run: |
          docker logs validator || true
          docker logs web || true
